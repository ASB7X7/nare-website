<!doctype html><html lang="en"><meta charset="utf-8"><title>NARÉ browser regression checks</title><style>body{font:14px system-ui;margin:25px;background:#eee;color:#111}li{padding:5px}.pass{color:#125c28}.fail{color:#b00020}iframe{display:block;border:1px solid #777;background:white}button{padding:12px}#status{font-size:22px}</style><h1>NARÉ browser regression checks</h1><p>Run against a local copy served over HTTP. The suite restores the device-local cart after testing. No orders are sent.</p><button id="run">Run checks</button><p id="status">Ready</p><ol id="results"></ol><iframe id="app" title="NARÉ under test" width="1440" height="900"></iframe><script>
'use strict';
const frame=document.querySelector('#app');const results=document.querySelector('#results');const status=document.querySelector('#status');
let passed=0,failed=0;let w,d;const delay=(ms=40)=>new Promise(r=>setTimeout(r,ms));
const q=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)];
function assert(value,message='Assertion failed'){if(!value)throw new Error(message)}
async function test(name,fn){try{await fn();passed++;results.insertAdjacentHTML('beforeend',`<li class="pass">PASS — ${name}</li>`)}catch(e){failed++;const li=document.createElement('li');li.className='fail';li.textContent=`FAIL — ${name}: ${e.message}`;results.append(li)}status.textContent=`Running: ${passed} passed, ${failed} failed`}
function change(selector,value,type='change'){const el=q(selector);assert(el,selector);el.value=value;el.dispatchEvent(new w.Event(type,{bubbles:true}))}
function click(selector){const el=q(selector);assert(el,selector);el.click()}
async function route(hash){w.location.hash=hash;await delay(80)}
async function reset(category){q(`#${category}-catalog form`).reset();await delay()}
const names=category=>all(`#${category}-catalog .product-title`).map(el=>el.textContent);
function submit(selector){q(selector).requestSubmit()}
function cartState(){return JSON.parse(w.localStorage.getItem('nare-cart-v1')||'[]')}
async function load(){await new Promise(resolve=>{frame.onload=resolve;frame.src='../index.html?qa='+Date.now()+'#top'});w=frame.contentWindow;d=w.document;await delay(100)}
function clearCart(){w.localStorage.removeItem('nare-cart-v1');w.dispatchEvent(new w.StorageEvent('storage',{key:'nare-cart-v1',newValue:null}))}
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;results.textContent='';passed=failed=0;const saved=localStorage.getItem('nare-cart-v1');const errors=[];
 try{await load();w.addEventListener('error',e=>errors.push(e.message));clearCart();
 await test('30 products: 8 coffees, 6 sweets, 16 equipment items',()=>{assert(names('coffee').length===8);assert(names('sweets').length===6);assert(names('equipment').length===16)});
 await test('All six grind options and three weight prices',()=>{click('#featured-coffee [data-quick="brazil"]');assert(all('#quick-form select[name="grind"] option').length===6);assert(all('#quick-form input[name="weight"]').length===3);click('#quick-form input[value="500"]');assert(q('.quick-price strong').textContent.replace(/\D/g,'')==='2450');q('#quick-view').close()});
 await route('coffee');
 await test('Combined blend + roast + country filters',()=>{change('#coffee-catalog [name="beanType"]','Арабика + Робуста');change('#coffee-catalog [name="roastLevel"]','Тёмная');change('#coffee-catalog [name="origin"]','Индия');assert(names('coffee').join()==='ITALIAN DARK')});await reset('coffee');
 await test('Composition 70 / 30 filter',()=>{change('#coffee-catalog [name="composition"]','70% Arabica / 30% Robusta');assert(names('coffee').join()==='ESPRESSO CREMA')});await reset('coffee');
 await test('Brewing method + flavor filter',()=>{change('#coffee-catalog [name="brewMethods"]','Фильтр');change('#coffee-catalog [name="tasteNotes"]','Цитрус');assert(names('coffee').join()==='ETHIOPIA ARABICA')});await reset('coffee');
 await test('Decaf collection filter',()=>{change('#coffee-catalog [name="tags"]','Декаф');assert(names('coffee').join()==='DECAF COLOMBIA')});await reset('coffee');
 await test('Case-insensitive search and no reload',()=>{const doc=d;change('#coffee-search','sAnToS','input');assert(names('coffee').join()==='BRAZIL SANTOS');assert(w.document===doc)});await reset('coffee');
 await test('Ascending, descending and new-item sorting',()=>{change('#coffee-catalog [name="sort"]','asc');assert(names('coffee')[0]==='ROBUSTA INTENSO');change('#coffee-catalog [name="sort"]','desc');assert(names('coffee')[0]==='DECAF COLOMBIA');change('#coffee-catalog [name="sort"]','new');assert(names('coffee')[0]==='COLOMBIA EL DIVISO')});await reset('coffee');
 await test('Price boundaries and empty state',()=>{change('#coffee-catalog [name="minPrice"]','1000','input');change('#coffee-catalog [name="maxPrice"]','1200','input');assert(names('coffee').length===2);change('#coffee-catalog [name="minPrice"]','5000','input');assert(!q('#coffee-catalog .empty-state').hidden);assert(names('coffee').length===0)});await reset('coffee');
 await test('Reset restores all products',()=>assert(names('coffee').length===8));
 await test('Variant cart lines, quantity and price',()=>{click('#coffee-catalog [data-quick="brazil"]');click('#quick-form [value="500"]');change('#quick-form [name="grind"]','Турка');change('#quick-form [name="quantity"]','2');submit('#quick-form');let lines=cartState();assert(lines.length===1&&lines[0].quantity===2&&lines[0].weight===500&&lines[0].grind==='Турка');assert(q('#cart-total').textContent.replace(/\D/g,'')==='4900');q('#quick-view').close();click('#coffee-catalog [data-add="brazil"]');assert(cartState().length===2);assert(q('.cart span').textContent==='3')});
 await route('sweets');
 await test('Sweets categories and quantity',()=>{change('#sweets-catalog [name="subcategory"]','Карамельные');assert(names('sweets').join()==='SALTED CARAMEL');change('#sweets-catalog .card-quantity input','2','input');click('#sweets-catalog [data-add="caramel"]');assert(cartState().find(i=>i.id==='caramel').quantity===2)});await reset('sweets');
 await test('Gift image, composition and gallery',()=>{click('#sweets-catalog [data-quick="gift"]');assert(q('#gallery-main img').src.includes('nare-sweets.webp'));assert(q('.quick-details').textContent.includes('360 г'));click('[data-gallery="1"]');assert(q('#gallery-main img').src.includes('chocolates.webp'));q('#quick-view').close()});
 await route('equipment-catalog');
 await test('16 equipment categories and availability filter',()=>{assert(all('#equipment-catalog [name="subcategory"] option').length===17);change('#equipment-catalog [name="availability"]','Нет в наличии');assert(names('equipment').join()==='AUTOMATIC ONE');assert(q('#equipment-catalog .add').disabled)});await reset('equipment');
 await test('Brand + category + price, equipment quantity',()=>{change('#equipment-catalog [name="brand"]','NARÉ Atelier');change('#equipment-catalog [name="subcategory"]','Турки');change('#equipment-catalog [name="maxPrice"]','4000','input');assert(names('equipment').join()==='COPPER CEZVE');change('#equipment-catalog .card-quantity input','2','input');click('#equipment-catalog [data-add="cezve"]');assert(cartState().find(i=>i.id==='cezve').quantity===2)});await reset('equipment');
 await test('Side cart increment, decrement, remove and all categories',()=>{click('.cart');assert(all('.cart-item').length===4);click('[data-cart-plus="0"]');assert(cartState()[0].quantity===3);click('[data-cart-minus="0"]');assert(cartState()[0].quantity===2);click('[data-cart-remove="1"]');assert(cartState().length===3);q('#side-cart').close()});
 await test('Stock limits shared by coffee variants; pair is atomic',()=>{clearCart();assert(w.addItems([w.defaultLine('brazil',24)]));assert(!w.addItems([w.defaultLine('brazil'),w.defaultLine('praline')]));assert(cartState().length===1&&cartState()[0].quantity===24);assert(!w.addItems([w.defaultLine('automatic')]));assert(!w.addItems([w.defaultLine('cezve',1.5)]));clearCart()});
 await route('pairing');
 await test('Pair recommendation and atomic two-item addition',()=>{change('#pairing-coffee','ethiopia');assert(q('.pair-explanation').textContent.includes('цитрусовые'));click('#add-pair');assert(cartState().length===2);assert(cartState().some(i=>i.id==='truffles'));assert(q('#cart-total').textContent.replace(/\D/g,'')==='3080')});
 await route('quiz');
 await test('Quiz uses taste, method and strength and renders three recommendations',()=>{click('#quiz-tastes [value="Фруктовый"]');click('#quiz-methods [value="Фильтр"]');click('#quiz-strength [value="Мягкую"]');submit('#coffee-quiz');assert(!q('#quiz-results').hidden);assert(all('#quiz-results .product').length===3);assert(q('#quiz-results .product').dataset.product==='ethiopia');const other=w.recommendCoffee('Насыщенный','Кофемашина','Крепкую');assert(other[0].id!== 'ethiopia');q('#coffee-quiz').reset();assert(q('#quiz-results').hidden)});
 await test('Reload restores cart variants and total',async()=>{await load();assert(q('.cart span').textContent==='2');assert(cartState().some(i=>i.id==='ethiopia'));assert(q('#cart-total').textContent.replace(/\D/g,'')==='3080')});
 await test('Malformed/stale stored cart is safely normalized',()=>{const clean=w.normalizeCart([null,{id:'missing',quantity:2},{id:'brazil',quantity:999,weight:500,grind:'Турка'},{id:'brazil',quantity:3,weight:250,grind:'В зернах'},{id:'cezve',quantity:-1}]);assert(clean.length===1&&clean[0].quantity===24&&clean[0].weight===500);assert(w.normalizeCart({evil:true}).length===0)});
 await route('fortune');
 await test('Fortune preparation: upload, consent and disabled paid request',()=>{const fortune=q('[data-page="fortune"]');assert(q('#fortune-submit').disabled);assert(q('#fortune-file').type==='file');assert(!q('#fortune-consent').checked);assert(q('#fortune-answer').hidden);assert(fortune.querySelectorAll('.fortune-steps li').length===4)});
 await test('Fortune validates files and previews locally without sending',async()=>{const setFile=file=>{const transfer=new w.DataTransfer();transfer.items.add(file);q('#fortune-file').files=transfer.files;q('#fortune-file').dispatchEvent(new w.Event('change',{bubbles:true}))};setFile(new w.File(['bad'],'bad.txt',{type:'text/plain'}));assert(q('#fortune-status').textContent.includes('до 5 МБ'));assert(q('#fortune-preview').hidden);const canvas=d.createElement('canvas');canvas.width=32;canvas.height=32;canvas.getContext('2d').fillRect(0,0,32,32);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));setFile(new w.File([blob],'test-cup.png',{type:'image/png'}));for(let i=0;i<30&&q('#fortune-preview').hidden;i++)await delay(50);assert(!q('#fortune-preview').hidden,'Image preview did not appear');click('#fortune-consent');assert(q('#fortune-submit').disabled,'Unconfigured API must remain disabled');click('#fortune-remove');assert(q('#fortune-preview').hidden);assert(!q('#fortune-photo').hasAttribute('src'));click('#fortune-consent')});
 await test('Unique IDs and labeled form controls',()=>{const ids=all('[id]').map(el=>el.id);assert(new Set(ids).size===ids.length);all('input,select,textarea').forEach(el=>assert(el.labels?.length||el.getAttribute('aria-label'),'Unlabeled '+el.outerHTML))});
 await test('Used local images load successfully',async()=>{const images=[...new Set(all('img[src]').map(el=>el.src))];for(const src of images){await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(new Error(src));img.src=src})}const atlas=new Image();await new Promise((r,j)=>{atlas.onload=r;atlas.onerror=j;atlas.src='../assets/equipment-atlas.webp'})});
 for(const width of [320,390,768,1024,1440]){frame.style.width=width+'px';frame.width=width;await delay(100);
   await test(`All routes fit viewport ${width}px`,async()=>{for(const hash of ['top','coffee','sweets','equipment-catalog','fortune']){await route(hash);assert(d.documentElement.scrollWidth<=w.innerWidth+1,`${hash}: ${d.documentElement.scrollWidth} > ${w.innerWidth}`)}});
   await test(`Quick View and cart fit ${width}px`,async()=>{await route('coffee');click('#coffee-catalog [data-quick="ethiopia"]');await delay(300);const r=q('#quick-view').getBoundingClientRect();assert(r.left>=-1&&r.right<=w.innerWidth+1);assert(q('#quick-view').scrollWidth<=q('#quick-view').clientWidth+1,'Quick View overflow');q('#quick-view').close();click('.cart');await delay(300);const c=q('#side-cart').getBoundingClientRect();assert(c.left>=-1&&c.right<=w.innerWidth+1,'Side cart overflow');q('#side-cart').close()});
 }
 frame.style.width='390px';await route('top');await delay(100);
 await test('Mobile menu closes on navigation, cart stays accessible',()=>{click('.menu');assert(q('.menu').getAttribute('aria-expanded')==='true');click('.nav a[href="#coffee"]')});await delay(100);
 await test('Mobile navigation state updated',()=>{assert(q('.menu').getAttribute('aria-expanded')==='false');assert(w.getComputedStyle(q('.cart')).display!=='none');assert(names('coffee').length===8)});
 await test('Checkout clearly describes a local draft without pretending to submit',()=>{click('.cart');click('#checkout-button');assert(!q('#checkout-form').hidden);assert(q('#checkout-form').textContent.includes('не оформляет заказ'));q('#side-cart').close()});
 await test('Checkout export includes selected items and honest draft status',async()=>{click('.cart');click('#checkout-button');let blob;let clicked=false;const originalURL=w.URL.createObjectURL;const originalClick=w.HTMLAnchorElement.prototype.click;try{w.URL.createObjectURL=function(value){blob=value;return originalURL.call(this,value)};w.HTMLAnchorElement.prototype.click=function(){clicked=this.download==='nare-request.txt'};submit('#checkout-form');assert(clicked&&blob);const text=await blob.text();assert(text.includes('не отправлена, не оплачена')&&text.includes('ETHIOPIA ARABICA')&&text.includes('DARK CHOCOLATE TRUFFLES'));}finally{w.URL.createObjectURL=originalURL;w.HTMLAnchorElement.prototype.click=originalClick;q('#side-cart').close()}});
 await test('No uncaught app errors',()=>assert(errors.length===0,errors.join('; ')));
 }catch(e){failed++;status.textContent=e.stack}
 finally{if(saved===null)localStorage.removeItem('nare-cart-v1');else localStorage.setItem('nare-cart-v1',saved);status.textContent=`Complete: ${passed} passed, ${failed} failed`;document.querySelector('#run').disabled=false;document.body.dataset.failed=failed;}
};
</script></html>
